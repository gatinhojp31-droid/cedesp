<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inscrição - cedespsaolucas.org</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <a href="/">Voltar para Home</a>


    <div class="container">
        <img src="img/banner-inscricao1.png" alt="Inscrição" class="banner">
        <h2>Formulário de Pré-Inscrição</h2>
        
        <form action="/cadastrar" method="POST">
            <p>Nome Completo: <br><input type="text" name="nome" required style="width: 100%;"></p>
            <p>E-mail: <br><input type="email" name="email" required style="width: 100%;"></p>
            <p>Telefone: <br><input type="tel" name="telefone" required style="width: 100%;"></p>
            <p>Curso de Interesse: <br>
                <select name="curso" style="width: 100%;">
                    <option value="administrativo">Assistente Administrativo</option>
                    <option value="cabeleireiro">cabeleireiro</option>
                    <option value="webdesign">(Design Gráfico)</option>
                    <option value="habilidades">Habilidades Sociais</option>
                </select>
            </p>
            <button type="submit" class="btn" style="border: none; cursor: pointer;">ENVIAR INSCRIÇÃO</button>
        </form>
    </div>
    <img src="img/banner-inscricao1.png" alt="Inscrição" class="banner">
</body>
</html>
